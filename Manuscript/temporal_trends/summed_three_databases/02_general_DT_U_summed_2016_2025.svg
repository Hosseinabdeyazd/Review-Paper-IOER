  <g id="text_16">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(135.240625 359.718781)">IEEE Xplore + Scopus + Web of Science: arithmetic sums; cross-database duplicates retained.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(121.296875 369.320969)">Historical query families differ in scope. U indicates search terms, not verified uncertainty treatment.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(188.321875 378.923156)">Complete calendar years through 2025; incomplete 2026 excluded.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(146.395625 388.525344)">General U uses the legacy literal term “uncertainty”; stage U uses a broader vocabulary.</text>
  </g>
