<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#526579"/></marker></defs>
<rect width="1000" height="850" fill="white"/>
<text x="500" y="36" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="25" fill="#17384c" direction="rtl" unicode-bidi="plaintext">۴. تصمیم متن کامل در مجموعه‌های متمرکز</text>
<path d="M330,195 L330,300" stroke="#526579" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M595,147 L650,147" stroke="#526579" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M330,395 L330,500" stroke="#526579" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M595,347 L650,347" stroke="#526579" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="65" y="100" width="530" height="95" rx="8" fill="#eaf3f8" stroke="#567180" stroke-width="1.3"/>
<text x="330.0" y="140.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">مجموعه‌های متمرکز قبلاً منتخب</text>
<text x="330.0" y="166.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">۵۳ عضویت / ۵۲ انتشار یکتا</text>
<rect x="650" y="100" width="300" height="95" rx="8" fill="#fff2db" stroke="#567180" stroke-width="1.3"/>
<text x="800.0" y="153.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">دریافت‌نشده: ۷</text>
<rect x="65" y="300" width="530" height="95" rx="8" fill="#eaf3f8" stroke="#567180" stroke-width="1.3"/>
<text x="330.0" y="353.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">متن کامل ارزیابی‌شده: ۴۵</text>
<rect x="650" y="300" width="300" height="95" rx="8" fill="#fff2db" stroke="#567180" stroke-width="1.3"/>
<text x="800.0" y="340.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">خروج پس از بررسی متن کامل:</text>
<text x="800.0" y="366.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">۲</text>
<rect x="65" y="500" width="870" height="110" rx="8" fill="#e8f4ec" stroke="#567180" stroke-width="1.3"/>
<text x="500.0" y="548.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">انتشار یکتای واردشده: ۴۳</text>
<text x="500.0" y="574.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">S+U: ۲۰ | پل DT حوزه: ۱۰ | DT+U متمرکز: ۱۴</text>
<rect x="100" y="660" width="800" height="75" rx="8" fill="#eaf3f8" stroke="#567180" stroke-width="1.3"/>
<text x="500.0" y="690.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">یک مقاله در دو گروه ورود مشترک است</text>
<text x="500.0" y="716.5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#17384c" direction="rtl" unicode-bidi="plaintext">۲۰ + ۱۰ + ۱۴ − ۱ = ۴۳</text>
<text x="500" y="795" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#17384c" direction="rtl" unicode-bidi="plaintext">فقط تصمیم زیرمجموعه؛ این شکل جریان شناسایی پایگاه‌ها نیست و با جست‌وجوی گسترده هم‌پوشانی دارد.</text>
</svg>