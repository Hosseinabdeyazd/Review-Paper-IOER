<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><rect width="1100" height="1000" fill="white"/>
<text x="35" y="40" font-family="Times New Roman" font-size="22" font-weight="bold" fill="black">B: CONFIGURATION CHOICES</text>
<text x="35" y="82" font-family="Times New Roman" font-size="29" font-weight="bold" fill="black">Digital twin configuration: separate facets, complementary responsibilities</text>
<text x="35" y="118" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">A literature-informed synthesis; descriptors may coexist and do not imply uncertainty capability.</text>
<rect x="35" y="155" width="330" height="340" rx="4" fill="#ECECEC" stroke="#4C78A8" stroke-width="2"/>
<text x="50" y="190" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">System composition</text>
<text x="50" y="234" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Unit and combination</text>
<text x="50" y="268" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Single, aggregate, composite;</text>
<text x="50" y="302" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">network, federation, ecosystem.</text>
<text x="50" y="336" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Uncertainty responsibility</text>
<text x="50" y="370" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Preserve entity identities and</text>
<text x="50" y="404" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">shared dependencies when</text>
<text x="50" y="438" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">combining components or stocks.</text>
<rect x="390" y="155" width="330" height="340" rx="4" fill="#ECECEC" stroke="#72B7B2" stroke-width="2"/>
<text x="405" y="190" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">Software and semantics</text>
<text x="405" y="234" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Software organisation</text>
<text x="405" y="268" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Layered, modular, service-oriented.</text>
<text x="405" y="302" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Knowledge representation</text>
<text x="405" y="336" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Knowledge graphs / semantic links.</text>
<text x="405" y="370" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Uncertainty responsibility</text>
<text x="405" y="404" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Retain variable meaning, units,</text>
<text x="405" y="438" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">provenance and interface contracts.</text>
<rect x="745" y="155" width="330" height="340" rx="4" fill="#ECECEC" stroke="#9D755D" stroke-width="2"/>
<text x="760" y="190" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">Computational model</text>
<text x="760" y="234" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Model basis</text>
<text x="760" y="268" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Physics-based, data-driven, hybrid.</text>
<text x="760" y="302" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Scale (a separate attribute)</text>
<text x="760" y="336" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Single-scale or multiscale scope.</text>
<text x="760" y="370" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Uncertainty responsibility</text>
<text x="760" y="404" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Specify input distributions,</text>
<text x="760" y="438" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">dependencies and transformations.</text>
<rect x="35" y="520" width="330" height="340" rx="4" fill="#ECECEC" stroke="#4C78A8" stroke-width="2"/>
<text x="50" y="555" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">Coupling and authority</text>
<text x="50" y="599" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Data exchange</text>
<text x="50" y="633" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">One-way or bidirectional.</text>
<text x="50" y="667" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Decision / control authority</text>
<text x="50" y="701" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Human-mediated or automated.</text>
<text x="50" y="735" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Uncertainty responsibility</text>
<text x="50" y="769" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Define what is transferred and</text>
<text x="50" y="803" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">who may approve a revision.</text>
<rect x="390" y="520" width="330" height="340" rx="4" fill="#ECECEC" stroke="#72B7B2" stroke-width="2"/>
<text x="405" y="555" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">Agency and simulation</text>
<text x="405" y="599" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Agent-based simulation</text>
<text x="405" y="633" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Models interacting entities.</text>
<text x="405" y="667" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Multi-agent orchestration</text>
<text x="405" y="701" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Coordinates software services.</text>
<text x="405" y="735" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Agentic AI (proposed here)</text>
<text x="405" y="769" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Goal-directed tool orchestration;</text>
<text x="405" y="803" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">not a substitute for UQ or testing.</text>
<rect x="745" y="520" width="330" height="340" rx="4" fill="#ECECEC" stroke="#9D755D" stroke-width="2"/>
<text x="760" y="555" font-family="Times New Roman" font-size="24" font-weight="bold" fill="black">Temporal organisation</text>
<text x="760" y="599" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Update trigger and cadence</text>
<text x="760" y="633" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Periodic, event-triggered or</text>
<text x="760" y="667" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">continuous; single / multiple rates.</text>
<text x="760" y="701" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Timing constraints (separate)</text>
<text x="760" y="735" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Latency, freshness and validity.</text>
<text x="760" y="769" font-family="Times New Roman" font-size="20" font-weight="bold" fill="black">Uncertainty responsibility</text>
<text x="760" y="803" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Invalidate stale dependent outputs.</text>
<text x="35" y="925" font-family="Times New Roman" font-size="21" font-weight="normal" fill="black">No universal compatibility or performance is inferred from selecting these descriptors.</text>
<text x="35" y="957" font-family="Times New Roman" font-size="20" font-weight="normal" fill="black">Grouping, scale/cadence attributes and S1–S5 responsibilities are the review synthesis.</text>
</svg>