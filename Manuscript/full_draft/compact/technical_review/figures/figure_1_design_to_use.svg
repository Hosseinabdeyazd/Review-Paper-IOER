<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="221.091mm" viewBox="0 0 1100 1280" role="img"><title>figure 1 design to use</title><rect x="0" y="0" width="1100" height="1280" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="45" y="39.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">FIGURE 1  |  PROPOSED SYNTHESIS</text><text x="45" y="77.6" font-family="Times New Roman, Liberation Serif, serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#2f2f2f">From digital twin design to evidence-informed decisions</text><text x="45" y="107.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Design choices specify an implementation; model activities act on its data and executable models.</text><rect x="55" y="137" width="990" height="102" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="71" y="168.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">A  Design brief + decision specification</text><text x="71" y="196.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Object and scope | Purpose | Architecture intent | Data needs | Required services</text><text x="71" y="219.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Decision subject, alternatives, objectives, horizon, evidence and authority. [R1, R2, R5, R6]</text><polyline points="290,239 290,278" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="290,278 294.0,269.0 286.0,269.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="810,239 810,278" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="810,278 814.0,269.0 806.0,269.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="278" width="440" height="100" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="71" y="309.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">B  Configuration choices</text><text x="71" y="337.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Composition, architecture, models, coupling,</text><text x="71" y="360.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">agency and timing. See Figure S2.</text><rect x="605" y="278" width="440" height="100" rx="3" fill="#ececec" stroke="#7f7f7f" stroke-width="1.5"/><text x="621" y="309.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">C  Functional allocation</text><text x="621" y="337.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Allocate activities to components and people;</text><text x="621" y="360.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">define inputs, methods, outputs and timing. [R2, R6]</text><polyline points="495,324 605,324" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="605,324 596.0,320.0 596.0,328.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polygon points="495,324 504.0,328.0 504.0,320.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="550" y="356.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#7f7f7f">co-design</text><polyline points="290,378 290,410 550,410 550,447" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="550,447 554.0,438.0 546.0,438.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="810,378 810,410 550,410" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><text x="55" y="422.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">DESIGN ARTIFACTS</text><rect x="55" y="447" width="990" height="102" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="71" y="478.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Implemented digital twin</text><text x="71" y="506.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Executable models + data pipelines + services + interfaces + assigned roles</text><text x="71" y="529.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">B describes its configuration; C specifies where required activities run. [R1, R2]</text><text x="635" y="585.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">ASSESS AND MAINTAIN FITNESS</text><text x="635" y="606.6800000000001" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">FOR THE INTENDED USE</text><polyline points="185,549 185,625" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="185,625 189.0,616.0 181.0,616.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="485,549 485,625" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="485,625 489.0,616.0 481.0,616.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="625" width="260" height="109" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="71" y="655.4" font-family="Times New Roman, Liberation Serif, serif" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Calibrate, if needed</text><text x="71" y="683.6663377638181" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Fit model parameters</text><text x="71" y="705.4869866319377" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">using observations.</text><text x="71" y="727.3076355000574" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Before or during use. [R3, R11]</text><rect x="365" y="625" width="260" height="109" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="381" y="655.4" font-family="Times New Roman, Liberation Serif, serif" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Verify and validate</text><text x="381" y="682.9112803371603" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Implementation checks;</text><text x="381" y="703.6085510826914" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">evaluate model adequacy</text><text x="381" y="724.3058218282226" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">with use-specific evidence. [R12]</text><polyline points="315,678 365,678" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="365,678 356.0,674.0 356.0,682.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="625,678 676,678" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="676,678 667.0,674.0 667.0,682.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polygon points="760.0,614 844,678.0 760.0,742 676,678.0" fill="#ececec" stroke="#9d755d" stroke-width="1.5" stroke-linejoin="round"/><text x="760.0" y="670.4000000000001" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2f2f2f">Criteria met</text><text x="760.0" y="693.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2f2f2f">for this use?</text><polyline points="844,678 890,678" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="890,678 881.0,674.0 881.0,682.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="854" y="668.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#9d755d">No</text><rect x="890" y="625" width="155" height="109" rx="3" fill="#ececec" stroke="#9d755d" stroke-width="1.5"/><text x="906" y="654.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#9d755d">Diagnose</text><text x="906" y="682.6506264869151" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Data, parameters,</text><text x="906" y="702.9600951625694" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">model form or</text><text x="906" y="723.2695638382236" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">design limitations.</text><polyline points="1045,678 1070,678 1070,497 1045,497" fill="none" stroke="#9d755d" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1045,497 1054.0,501.0 1054.0,493.0" fill="#9d755d" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="55" y="772.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Calibration does not establish validity. Reassess after revisions.</text><text x="55" y="791.64" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">A failed check need not mean recalibration.</text><text x="55" y="820.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">USE THE TWIN FOR THE DECISION DEFINED IN A</text><polyline points="760,742 760,847 190,847 190,887" fill="none" stroke="#4c78a8" stroke-width="1.6" stroke-linejoin="round"/><polygon points="190,887 194.0,878.0 186.0,878.0" fill="#4c78a8" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="770" y="785.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#4c78a8">Yes: within assessed scope</text><rect x="55" y="887" width="270" height="110" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="71" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Estimate / predict</text><text x="71" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Observations and models</text><text x="71" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">produce decision-relevant</text><text x="71" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">quantities, when required. [R3]</text><rect x="415" y="887" width="270" height="110" rx="3" fill="#ececec" stroke="#4c78a8" stroke-width="1.5"/><text x="431" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Compare / optimize</text><text x="431" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Evaluate alternatives against</text><text x="431" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">objectives and constraints,</text><text x="431" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">when required. [R7-R10, R13]</text><rect x="775" y="887" width="270" height="110" rx="3" fill="#ececec" stroke="#7f7f7f" stroke-width="1.5"/><text x="791" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">Select / approve</text><text x="791" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Human or delegated role;</text><text x="791" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">apply the authority and</text><text x="791" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">limits specified in A. [R6]</text><polyline points="325,941 415,941" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="415,941 406.0,937.0 406.0,945.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="685,941 775,941" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="775,941 766.0,937.0 766.0,945.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="910,997 910,1030 550,1030 550,1060" fill="none" stroke="#7f7f7f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="550,1060 554.0,1051.0 546.0,1051.0" fill="#7f7f7f" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="1060" width="990" height="92" rx="3" fill="#ececec" stroke="#7f7f7f" stroke-width="1.5"/><text x="71" y="1091.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">Decision outputs depend on the use case</text><text x="71" y="1119.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Design choice | Maintenance or recovery plan | Operating schedule | Recommendation</text><text x="71" y="1142.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Physical command only where execution is authorized. Observe outcomes after implementation. [R5, R6, R9, R13]</text><text x="55" y="1188.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Arrows show the proposed design and evidence relations, not a compulsory lifecycle sequence.</text><text x="55" y="1215.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Monitoring can be an end service. Prediction, optimization and physical control are not mandatory for every use case.</text><text x="55" y="1247.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">The layout and A-B-C organization are our synthesis. Reference keys and evidence limits: papers/academic-foundations.md.</text><style>text,tspan{font-family:"Times New Roman",serif !important}</style></svg>
