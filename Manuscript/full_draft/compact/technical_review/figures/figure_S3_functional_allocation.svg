<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="163.083mm" viewBox="0 0 1200 1030" role="img"><title>figure S3 functional allocation</title><rect x="0" y="0" width="1200" height="1030" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="45" y="39.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#7f7f7f">FIGURE S3  |  C: FUNCTIONAL ALLOCATION</text><text x="45" y="77.6" font-family="Times New Roman, Liberation Serif, serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#2f2f2f">Locate activities in the implemented twin</text><text x="45" y="107.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">A specifies the need; B constrains implementation; C allocates the required work. The rows are not stages.</text><rect x="45" y="152" width="170" height="60" rx="0" fill="#4c78a8" stroke="#ffffff" stroke-width="1"/><text x="58" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#ffffff">Activity</text><rect x="215" y="152" width="240" height="60" rx="0" fill="#4c78a8" stroke="#ffffff" stroke-width="1"/><text x="228" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#ffffff">Consumes</text><rect x="455" y="152" width="285" height="60" rx="0" fill="#4c78a8" stroke="#ffffff" stroke-width="1"/><text x="468" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#ffffff">Changes / produces</text><rect x="740" y="152" width="415" height="60" rx="0" fill="#4c78a8" stroke="#ffffff" stroke-width="1"/><text x="753" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#ffffff">Allocation and links to B</text><rect x="45" y="212" width="170" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="58" y="251.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Calibration</text><text x="58" y="276.84000000000003" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8"></text><rect x="215" y="212" width="240" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="228" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Observations; model;</text><text x="228" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">adjustable parameters;</text><text x="228" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">fit criterion.</text><rect x="455" y="212" width="285" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="468" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Changes model parameters;</text><text x="468" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">produces fitted values and</text><text x="468" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">associated uncertainty.</text><rect x="740" y="212" width="415" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="753" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Model-update component.</text><text x="753" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Model basis, data interfaces,</text><text x="753" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">update timing and coordination.</text><rect x="45" y="337" width="170" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="58" y="376.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Validation</text><text x="58" y="401.84000000000003" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8"></text><rect x="215" y="337" width="240" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="228" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Model version; evaluation</text><text x="228" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">evidence; intended use;</text><text x="228" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">acceptance criteria.</text><rect x="455" y="337" width="285" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="468" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Assesses adequacy for the use;</text><text x="468" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">produces evidence and limits.</text><text x="468" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Does not itself tune results.</text><rect x="740" y="337" width="415" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="753" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Evaluation capability and owner.</text><text x="753" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Models, interfaces and timing;</text><text x="753" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">system-level interactions.</text><rect x="45" y="462" width="170" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="58" y="501.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Prediction</text><text x="58" y="526.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8"></text><rect x="215" y="462" width="240" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="228" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Model; current state;</text><text x="228" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">inputs, scenarios and</text><text x="228" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">prediction horizon.</text><rect x="455" y="462" width="285" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="468" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Estimates future or unobserved</text><text x="468" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">quantities, with uncertainty</text><text x="468" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">where characterized.</text><rect x="740" y="462" width="415" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="753" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Inference / simulation service.</text><text x="753" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Model choice, computation,</text><text x="753" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">coordination and delivery timing.</text><rect x="45" y="587" width="170" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="58" y="626.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Optimization</text><text x="58" y="651.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8"></text><rect x="215" y="587" width="240" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="228" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Decision variables;</text><text x="228" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">objectives; constraints;</text><text x="228" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">a way to evaluate options.</text><rect x="455" y="587" width="285" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="468" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Searches decision alternatives;</text><text x="468" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">returns candidates or trade-offs.</text><text x="468" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Does not imply physical action.</text><rect x="740" y="587" width="415" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="753" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Optimization service + decision role.</text><text x="753" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Models, architecture, coordination,</text><text x="753" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">latency and authority requirements.</text><rect x="45" y="712" width="170" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="58" y="751.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8">Control</text><text x="58" y="776.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#4c78a8"></text><rect x="215" y="712" width="240" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="228" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Observed / estimated state;</text><text x="228" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">reference or objective;</text><text x="228" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">control law; allowed actions.</text><rect x="455" y="712" width="285" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="468" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Determines control inputs;</text><text x="468" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">when executed, changes the</text><text x="468" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">behaviour of the target.</text><rect x="740" y="712" width="415" height="125" rx="0" fill="#ffffff" stroke="#d9d9d9" stroke-width="0.8"/><text x="753" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Controller + execution interface.</text><text x="753" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Coupling, feedback, timing,</text><text x="753" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">responsibility and limits.</text><text x="45" y="876.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#2f2f2f">Verification checks implementation and specified requirements; validation addresses fitness for intended use. </text><text x="45" y="909.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#2f2f2f">Architecture descriptors are not calibrated. Activities operate on models, data or decision variables in an implementation.</text><text x="45" y="943.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Mappings to B are proposed design implications, not a universal allocation matrix. Any family may be affected in context.</text><text x="45" y="975.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">The optimization target must be explicit: fitting model parameters differs from choosing a maintenance plan or control input.</text><text x="45" y="1007.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#7f7f7f">Execution may be internal, an external service or a human responsibility. Specify interfaces, triggers, ownership and evidence.</text><style>text,tspan{font-family:"Times New Roman",serif !important}</style></svg>
