<path d="M837 660 L837 720" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<path d="M1072 660 L1072 720" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<text x="600" y="885" font-family="Arial" font-size="22" fill="#17384b" text-anchor="middle">Diagnostic limits</text>
<text x="600" y="919" font-family="Arial" font-size="18" fill="#17384b" text-anchor="middle">A residual can flag disagreement; it does not identify every uncertainty source.</text>
<text x="600" y="949" font-family="Arial" font-size="18" fill="#17384b" text-anchor="middle">No universal threshold, automatic reduction or end-to-end deployment is claimed.</text>
</svg>