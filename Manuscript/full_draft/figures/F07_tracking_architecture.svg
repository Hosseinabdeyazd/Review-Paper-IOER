<text x="1060.0" y="282" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Impacts</text>
<rect x="45" y="365" width="1110" height="110" rx="5" fill="#f4edf6" stroke="#678a99"/>
<text x="600.0" y="393" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">B. Shared interface contract — proposed cross-study connection</text>
<text x="600.0" y="422" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Entity + variable + unit | U representation + dependencies | transformation + assumptions</text>
<text x="600.0" y="446" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Spatial support + valid time | version + evidence | downstream use</text>
<path d="M140 315 L140 365" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<path d="M370 315 L370 365" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<path d="M600 315 L600 365" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<path d="M830 315 L830 365" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<path d="M1060 315 L1060 365" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<rect x="25" y="540" width="215" height="120" rx="5" fill="#eaf3f5" stroke="#678a99"/>
<text x="132.5" y="568" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">Observe</text>
<text x="132.5" y="597" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Quality / timing</text>
<text x="132.5" y="621" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Missing or stale data</text>
