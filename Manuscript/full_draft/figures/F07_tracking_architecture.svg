<text x="1072.5" y="621" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Conditions and authority</text>
<path d="M1072 475 L1072 540" stroke="#326678" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="720" width="1110" height="100" rx="5" fill="#eaf4ec" stroke="#678a99"/>
<text x="600.0" y="748" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">C. Traceable update and explanation</text>
<text x="600.0" y="777" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Retain previous state → record new evidence → revise the relevant model → reassess the decision</text>
<text x="600.0" y="801" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Capability concepts: R2, R3, R5, R6, R15; allocation to all S1–S5 boundaries is our synthesis.</text>
