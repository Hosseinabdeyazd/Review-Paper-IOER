<text x="837.5" y="597" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Residuals / coverage</text>
<text x="837.5" y="621" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Mismatch, not unique cause</text>
