<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#326678"/></marker></defs><rect width="1200" height="1020" fill="white"/>
<text x="600" y="38" font-family="Arial" font-size="29" fill="#17384b" text-anchor="middle">Uncertainty tracking across material-flow interfaces</text>
<text x="600" y="68" font-family="Arial" font-size="18" fill="#17384b" text-anchor="middle">Proposed synthesis: reported capabilities mapped to explicit interface requirements</text>
