<text x="600.0" y="123" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">A. Intended use and evidence requirement</text>
<text x="600.0" y="152" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Quantity of interest | spatial support | time horizon | tolerance | decision authority</text>
<rect x="45" y="225" width="190" height="90" rx="5" fill="#eaf3f5" stroke="#678a99"/>
<text x="140.0" y="253" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">S1</text>
