<rect x="495" y="540" width="215" height="120" rx="5" fill="#eaf3f5" stroke="#678a99"/>
<text x="602.5" y="568" font-family="Arial" font-size="21" fill="#17384b" text-anchor="middle">Propagate</text>
<text x="602.5" y="597" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Samples / dependencies</text>
<text x="602.5" y="621" font-family="Arial" font-size="17" fill="#17384b" text-anchor="middle">Input-to-output mapping</text>
