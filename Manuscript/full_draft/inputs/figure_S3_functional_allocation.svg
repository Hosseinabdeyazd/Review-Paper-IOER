<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="163.083mm" viewBox="0 0 1200 1030" role="img"><title>figure S3 functional allocation</title><rect x="0" y="0" width="1200" height="1030" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="45" y="39.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">FIGURE S3  |  C: FUNCTIONAL ALLOCATION</text><text x="45" y="77.6" font-family="Times New Roman, Liberation Serif, serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#26364A">Locate activities in the implemented twin</text><text x="45" y="107.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">A specifies the need; B constrains implementation; C allocates the required work. The rows are not stages.</text><rect x="45" y="152" width="170" height="60" rx="0" fill="#355C7D" stroke="#FFFFFF" stroke-width="1"/><text x="58" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#FFFFFF">Activity</text><rect x="215" y="152" width="240" height="60" rx="0" fill="#355C7D" stroke="#FFFFFF" stroke-width="1"/><text x="228" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#FFFFFF">Consumes</text><rect x="455" y="152" width="285" height="60" rx="0" fill="#355C7D" stroke="#FFFFFF" stroke-width="1"/><text x="468" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#FFFFFF">Changes / produces</text><rect x="740" y="152" width="415" height="60" rx="0" fill="#355C7D" stroke="#FFFFFF" stroke-width="1"/><text x="753" y="188.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#FFFFFF">Allocation and links to B</text><rect x="45" y="212" width="170" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="58" y="251.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Calibration</text><text x="58" y="276.84000000000003" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">[R3, R11]</text><rect x="215" y="212" width="240" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="228" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Observations; model;</text><text x="228" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">adjustable parameters;</text><text x="228" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">fit criterion.</text><rect x="455" y="212" width="285" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="468" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Changes model parameters;</text><text x="468" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">produces fitted values and</text><text x="468" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">associated uncertainty.</text><rect x="740" y="212" width="415" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="753" y="249.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Model-update component.</text><text x="753" y="272.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Model basis, data interfaces,</text><text x="753" y="295.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">update timing and coordination.</text><rect x="45" y="337" width="170" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="58" y="376.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Validation</text><text x="58" y="401.84000000000003" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">[R12]</text><rect x="215" y="337" width="240" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="228" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Model version; evaluation</text><text x="228" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">evidence; intended use;</text><text x="228" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">acceptance criteria.</text><rect x="455" y="337" width="285" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="468" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Assesses adequacy for the use;</text><text x="468" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">produces evidence and limits.</text><text x="468" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Does not itself tune results.</text><rect x="740" y="337" width="415" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="753" y="374.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Evaluation capability and owner.</text><text x="753" y="397.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Models, interfaces and timing;</text><text x="753" y="420.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">system-level interactions.</text><rect x="45" y="462" width="170" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="58" y="501.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Prediction</text><text x="58" y="526.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">[R3, R10]</text><rect x="215" y="462" width="240" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="228" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Model; current state;</text><text x="228" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">inputs, scenarios and</text><text x="228" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">prediction horizon.</text><rect x="455" y="462" width="285" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="468" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Estimates future or unobserved</text><text x="468" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">quantities, with uncertainty</text><text x="468" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">where characterized.</text><rect x="740" y="462" width="415" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="753" y="499.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Inference / simulation service.</text><text x="753" y="522.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Model choice, computation,</text><text x="753" y="545.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">coordination and delivery timing.</text><rect x="45" y="587" width="170" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="58" y="626.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Optimization</text><text x="58" y="651.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">[R7-R10, R13]</text><rect x="215" y="587" width="240" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="228" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Decision variables;</text><text x="228" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">objectives; constraints;</text><text x="228" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">a way to evaluate options.</text><rect x="455" y="587" width="285" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="468" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Searches decision alternatives;</text><text x="468" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">returns candidates or trade-offs.</text><text x="468" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Does not imply physical action.</text><rect x="740" y="587" width="415" height="125" rx="0" fill="#FFFFFF" stroke="#DCE1E6" stroke-width="0.8"/><text x="753" y="624.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Optimization service + decision role.</text><text x="753" y="647.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Models, architecture, coordination,</text><text x="753" y="670.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">latency and authority requirements.</text><rect x="45" y="712" width="170" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="58" y="751.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Control</text><text x="58" y="776.84" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">[R6, R10]</text><rect x="215" y="712" width="240" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="228" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Observed / estimated state;</text><text x="228" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">reference or objective;</text><text x="228" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">control law; allowed actions.</text><rect x="455" y="712" width="285" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="468" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Determines control inputs;</text><text x="468" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">when executed, changes the</text><text x="468" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">behaviour of the target.</text><rect x="740" y="712" width="415" height="125" rx="0" fill="#F4F6F8" stroke="#DCE1E6" stroke-width="0.8"/><text x="753" y="749.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Controller + execution interface.</text><text x="753" y="772.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Coupling, feedback, timing,</text><text x="753" y="795.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">responsibility and limits.</text><text x="45" y="876.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Verification checks implementation and specified requirements; validation addresses fitness for intended use. [R12]</text><text x="45" y="909.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#26364A">Architecture descriptors are not calibrated. Activities operate on models, data or decision variables in an implementation.</text><text x="45" y="943.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Mappings to B are proposed design implications, not a universal allocation matrix. Any family may be affected in context.</text><text x="45" y="975.76" font-family="Times New Roman, Liberation Serif, serif" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">The optimization target must be explicit: fitting model parameters differs from choosing a maintenance plan or control input.</text><text x="45" y="1007.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Execution may be internal, an external service or a human responsibility. Specify interfaces, triggers, ownership and evidence.</text></svg>
