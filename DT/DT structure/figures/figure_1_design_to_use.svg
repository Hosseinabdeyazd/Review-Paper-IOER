<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="221.091mm" viewBox="0 0 1100 1280" role="img"><title>figure 1 design to use</title><rect x="0" y="0" width="1100" height="1280" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="45" y="39.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">FIGURE 1  |  PROPOSED SYNTHESIS</text><text x="45" y="77.6" font-family="Times New Roman, Liberation Serif, serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#26364A">From digital twin design to evidence-informed decisions</text><text x="45" y="107.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Design choices specify an implementation; model activities act on its data and executable models.</text><rect x="55" y="137" width="990" height="102" rx="3" fill="#F0F4F8" stroke="#355C7D" stroke-width="1.5"/><text x="71" y="168.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">A  Design brief + decision specification</text><text x="71" y="196.57999999999998" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Object and scope | Purpose | Architecture intent | Data needs | Required services</text><text x="71" y="219.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Decision subject, alternatives, objectives, horizon, evidence and authority. [R1, R2, R5, R6]</text><polyline points="290,239 290,278" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="290,278 294.0,269.0 286.0,269.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="810,239 810,278" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="810,278 814.0,269.0 806.0,269.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="278" width="440" height="100" rx="3" fill="#F0F4F8" stroke="#355C7D" stroke-width="1.5"/><text x="71" y="309.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">B  Configuration choices</text><text x="71" y="337.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Composition, architecture, models, coupling,</text><text x="71" y="360.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">agency and timing. See Figure S2.</text><rect x="605" y="278" width="440" height="100" rx="3" fill="#F7F1F5" stroke="#795269" stroke-width="1.5"/><text x="621" y="309.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#795269">C  Functional allocation</text><text x="621" y="337.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Allocate activities to components and people;</text><text x="621" y="360.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">define inputs, methods, outputs and timing. [R2, R6]</text><polyline points="495,324 605,324" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="605,324 596.0,320.0 596.0,328.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polygon points="495,324 504.0,328.0 504.0,320.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="550" y="356.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#687282">co-design</text><polyline points="290,378 290,410 550,410 550,447" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="550,447 554.0,438.0 546.0,438.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="810,378 810,410 550,410" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><text x="55" y="422.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">DESIGN ARTIFACTS</text><rect x="55" y="447" width="990" height="102" rx="3" fill="#F0F6F5" stroke="#356B70" stroke-width="1.5"/><text x="71" y="478.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#356B70">Implemented digital twin</text><text x="71" y="506.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Executable models + data pipelines + services + interfaces + assigned roles</text><text x="71" y="529.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">B describes its configuration; C specifies where required activities run. [R1, R2]</text><text x="635" y="585.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">ASSESS AND MAINTAIN FITNESS</text><text x="635" y="606.6800000000001" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">FOR THE INTENDED USE</text><polyline points="185,549 185,625" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="185,625 189.0,616.0 181.0,616.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="485,549 485,625" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="485,625 489.0,616.0 481.0,616.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="625" width="260" height="109" rx="3" fill="#F0F6F5" stroke="#356B70" stroke-width="1.5"/><text x="71" y="655.4" font-family="Times New Roman, Liberation Serif, serif" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#356B70">Calibrate, if needed</text><text x="71" y="683.6663377638181" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Fit model parameters</text><text x="71" y="705.4869866319377" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">using observations.</text><text x="71" y="727.3076355000574" font-family="Times New Roman, Liberation Serif, serif" font-size="17.885777760753818" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Before or during use. [R3, R11]</text><rect x="365" y="625" width="260" height="109" rx="3" fill="#F0F6F5" stroke="#356B70" stroke-width="1.5"/><text x="381" y="655.4" font-family="Times New Roman, Liberation Serif, serif" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#356B70">Verify and validate</text><text x="381" y="682.9112803371603" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Implementation checks;</text><text x="381" y="703.6085510826914" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">evaluate model adequacy</text><text x="381" y="724.3058218282226" font-family="Times New Roman, Liberation Serif, serif" font-size="16.96497602092719" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">with use-specific evidence. [R12]</text><polyline points="315,678 365,678" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="365,678 356.0,674.0 356.0,682.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="625,678 676,678" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="676,678 667.0,674.0 667.0,682.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polygon points="760.0,614 844,678.0 760.0,742 676,678.0" fill="#FAF5EF" stroke="#936637" stroke-width="1.5" stroke-linejoin="round"/><text x="760.0" y="670.4000000000001" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#26364A">Criteria met</text><text x="760.0" y="693.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#26364A">for this use?</text><polyline points="844,678 890,678" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="890,678 881.0,674.0 881.0,682.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="854" y="668.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#936637">No</text><rect x="890" y="625" width="155" height="109" rx="3" fill="#FAF5EF" stroke="#936637" stroke-width="1.5"/><text x="906" y="654.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#936637">Diagnose</text><text x="906" y="682.6506264869151" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Data, parameters,</text><text x="906" y="702.9600951625694" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">model form or</text><text x="906" y="723.2695638382236" font-family="Times New Roman, Liberation Serif, serif" font-size="16.647105471847738" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">design limitations.</text><polyline points="1045,678 1070,678 1070,497 1045,497" fill="none" stroke="#936637" stroke-width="1.6" stroke-linejoin="round"/><polygon points="1045,497 1054.0,501.0 1054.0,493.0" fill="#936637" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="55" y="772.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Calibration does not establish validity. Reassess after revisions.</text><text x="55" y="791.64" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">A failed check need not mean recalibration.</text><text x="55" y="820.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#687282">USE THE TWIN FOR THE DECISION DEFINED IN A</text><polyline points="760,742 760,847 190,847 190,887" fill="none" stroke="#356B70" stroke-width="1.6" stroke-linejoin="round"/><polygon points="190,887 194.0,878.0 186.0,878.0" fill="#356B70" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="770" y="785.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#356B70">Yes: within assessed scope</text><rect x="55" y="887" width="270" height="110" rx="3" fill="#F0F4F8" stroke="#355C7D" stroke-width="1.5"/><text x="71" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Estimate / predict</text><text x="71" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Observations and models</text><text x="71" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">produce decision-relevant</text><text x="71" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">quantities, when required. [R3]</text><rect x="415" y="887" width="270" height="110" rx="3" fill="#F0F4F8" stroke="#355C7D" stroke-width="1.5"/><text x="431" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#355C7D">Compare / optimize</text><text x="431" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Evaluate alternatives against</text><text x="431" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">objectives and constraints,</text><text x="431" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">when required. [R7-R10, R13]</text><rect x="775" y="887" width="270" height="110" rx="3" fill="#F7F1F5" stroke="#795269" stroke-width="1.5"/><text x="791" y="918.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#795269">Select / approve</text><text x="791" y="946.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Human or delegated role;</text><text x="791" y="969.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">apply the authority and</text><text x="791" y="992.94" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">limits specified in A. [R6]</text><polyline points="325,941 415,941" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="415,941 406.0,937.0 406.0,945.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="685,941 775,941" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="775,941 766.0,937.0 766.0,945.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><polyline points="910,997 910,1030 550,1030 550,1060" fill="none" stroke="#88929E" stroke-width="1.6" stroke-linejoin="round"/><polygon points="550,1060 554.0,1051.0 546.0,1051.0" fill="#88929E" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="55" y="1060" width="990" height="92" rx="3" fill="#F7F1F5" stroke="#795269" stroke-width="1.5"/><text x="71" y="1091.22" font-family="Times New Roman, Liberation Serif, serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#795269">Decision outputs depend on the use case</text><text x="71" y="1119.58" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Design choice | Maintenance or recovery plan | Operating schedule | Recommendation</text><text x="71" y="1142.76" font-family="Times New Roman, Liberation Serif, serif" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#26364A">Physical command only where execution is authorized. Observe outcomes after implementation. [R5, R6, R9, R13]</text><text x="55" y="1188.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Arrows show the proposed design and evidence relations, not a compulsory lifecycle sequence.</text><text x="55" y="1215.94" font-family="Times New Roman, Liberation Serif, serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">Monitoring can be an end service. Prediction, optimization and physical control are not mandatory for every use case.</text><text x="55" y="1247.12" font-family="Times New Roman, Liberation Serif, serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#687282">The layout and A-B-C organization are our synthesis. Reference keys and evidence limits: papers/academic-foundations.md.</text></svg>