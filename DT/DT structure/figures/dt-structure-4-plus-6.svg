  <text class="option" x="391" y="764">Layered</text><text class="option" x="391" y="808">Modular</text><text class="option" x="391" y="852">Service-oriented</text><text class="option" x="391" y="896">Knowledge-graph-based</text>
  <rect class="box" x="690" y="650" width="310" height="475" rx="8"/><rect class="accent1" x="690" y="650" width="310" height="9" rx="4"/>
  <text class="dim-title" x="716" y="700">3 · Computational Model</text><line class="rule" x1="716" y1="722" x2="974" y2="722"/>
  <text class="option" x="716" y="764">Physics-based</text><text class="option" x="716" y="808">Data-driven</text><text class="option" x="716" y="852">Hybrid</text><text class="option" x="716" y="896">Multiscale</text>
  <rect class="box" x="1015" y="650" width="310" height="475" rx="8"/><rect class="accent3" x="1015" y="650" width="310" height="9" rx="4"/>
  <text class="dim-title" x="1041" y="700">4 · Coupling &amp; Control</text><line class="rule" x1="1041" y1="722" x2="1299" y2="722"/>
  <text class="option" x="1041" y="764">One-way</text><text class="option" x="1041" y="808">Bidirectional</text><text class="option" x="1041" y="852">Human-mediated</text><text class="option" x="1041" y="896">Automated closed-loop</text>
  <rect class="box" x="1340" y="650" width="310" height="475" rx="8"/><rect class="accent4" x="1340" y="650" width="310" height="9" rx="4"/>
  <text class="dim-title" x="1366" y="700">5 · Agency &amp; Intelligence</text><line class="rule" x1="1366" y1="722" x2="1624" y2="722"/>
  <text class="option" x="1366" y="764">Rule-based</text><text class="option" x="1366" y="808">Agent-based</text><text class="option" x="1366" y="852">Multi-agent</text><text class="option" x="1366" y="896">Agentic AI</text>
  <rect class="box" x="1665" y="650" width="310" height="475" rx="8"/><rect class="accent2" x="1665" y="650" width="310" height="9" rx="4"/>
  <text class="dim-title" x="1691" y="700">6 · Temporal Organization</text><line class="rule" x1="1691" y1="722" x2="1949" y2="722"/>
  <text class="option" x="1691" y="764">Continuous</text><text class="option" x="1691" y="808">Periodic</text><text class="option" x="1691" y="852">Event-driven</text><text class="option" x="1691" y="896">Multi-rate</text>
</g>
<line class="rule" x1="70" y1="1170" x2="1930" y2="1170"/>
<path class="legendline" d="M75 1205 L165 1205"/><text class="foot" x="184" y="1211">Guiding relationship synthesized from the literature</text>
<path class="legendcross" d="M750 1205 L840 1205"/><text class="foot" x="860" y="1211">Assurance applies across all six configuration dimensions</text>
<text class="foot" x="1930" y="1252" text-anchor="end">Provisional research synthesis · not a single paper's taxonomy · references [1–10] in papers/README.md</text>
</svg>