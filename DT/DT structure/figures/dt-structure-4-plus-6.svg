  <path class="edge" d="M1242 360 C1170 470 520 520 520 650"/>
  <path class="edge" d="M1242 360 C1220 470 1170 520 1170 650"/>
  <path class="edge" d="M1242 360 C1290 470 1495 520 1495 650"/>
