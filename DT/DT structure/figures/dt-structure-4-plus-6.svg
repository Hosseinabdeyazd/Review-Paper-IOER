<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1280" role="img" aria-labelledby="title desc">
<title id="title">A two-level framework for Digital Twin structure</title>
<desc id="desc">Four meta-level design concerns guide six interacting Digital Twin configuration dimensions. Purpose and scope, data governance, interfaces and interoperability, and assurance and evidence influence system composition, internal architecture, computational model, coupling and control, agency and intelligence, and temporal organization. Assurance and evidence is cross-cutting. This is a provisional synthesis, not a published taxonomy.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#66717d"/></marker>
  <style>
    .bg{fill:#fbfcfd}
    .title{font:600 40px Georgia,serif;fill:#172b3a}
    .sub{font:400 22px Georgia,serif;fill:#536170}
    .layer{font:600 20px Georgia,serif;letter-spacing:2px;fill:#536170}
    .box{fill:#fff;stroke:#cbd4dc;stroke-width:2}
    .accent1{fill:#264653}.accent2{fill:#386890}.accent3{fill:#b77936}.accent4{fill:#75527f}
    .meta-title{font:600 24px Georgia,serif;fill:#172b3a}
    .meta-desc{font:400 17px Georgia,serif;fill:#465564}
    .dim-title{font:600 23px Georgia,serif;fill:#172b3a}
    .option{font:400 18px Georgia,serif;fill:#465564}
    .edge{fill:none;stroke:#66717d;stroke-width:2.2;opacity:.28;marker-end:url(#arrow)}
    .edge-assurance{fill:none;stroke:#75527f;stroke-width:2.4;stroke-dasharray:8 8;opacity:.55;marker-end:url(#arrow)}
    .rule{stroke:#d9e0e5;stroke-width:1.5}
    .pill{fill:#edf2f5}
    .pilltext{font:500 15px Georgia,serif;fill:#465564}
    .foot{font:400 16px Georgia,serif;fill:#536170}
    .legendline{fill:none;stroke:#66717d;stroke-width:2.2;opacity:.55;marker-end:url(#arrow)}
    .legendcross{fill:none;stroke:#75527f;stroke-width:2.4;stroke-dasharray:8 8;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="2000" height="1280"/>
<text class="title" x="70" y="76">Digital Twin structure: a two-level design space</text>
<text class="sub" x="70" y="116">Meta-level concerns guide, constrain and assess configuration choices; they do not map one-to-one.</text>

<text class="layer" x="70" y="170">LEVEL 1 · META-LEVEL DESIGN CONCERNS</text>
<text class="sub" x="1930" y="170" text-anchor="end">WHY · UNDER WHAT RULES · HOW CONNECTED · HOW TRUSTWORTHY</text>

