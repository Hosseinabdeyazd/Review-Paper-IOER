  <path class="edge-assurance" d="M1727 360 C1740 470 1820 520 1820 650"/>
</g>

<!-- four meta-level concerns -->
<g>
  <rect class="box" x="55" y="195" width="435" height="165" rx="8"/><rect class="accent1" x="55" y="195" width="10" height="165" rx="5"/>
  <text class="meta-title" x="82" y="237">Purpose, Scope &amp; Context</text>
  <text class="meta-desc" x="82" y="273">Decision need · entity · boundary</text><text class="meta-desc" x="82" y="299">scale · operating context · use</text>
  <rect class="box" x="540" y="195" width="435" height="165" rx="8"/><rect class="accent2" x="540" y="195" width="10" height="165" rx="5"/>
  <text class="meta-title" x="567" y="237">Data, Semantics &amp; Governance</text>
  <text class="meta-desc" x="567" y="273">Sources · meaning · quality · provenance</text><text class="meta-desc" x="567" y="299">ownership · access · security · retention</text>
  <rect class="box" x="1025" y="195" width="435" height="165" rx="8"/><rect class="accent3" x="1025" y="195" width="10" height="165" rx="5"/>
  <text class="meta-title" x="1052" y="237">Interfaces &amp; Interoperability</text>
  <text class="meta-desc" x="1052" y="273">People · physical systems · other twins</text><text class="meta-desc" x="1052" y="299">APIs · standards · semantic mappings</text>
  <rect class="box" x="1510" y="195" width="435" height="165" rx="8"/><rect class="accent4" x="1510" y="195" width="10" height="165" rx="5"/>
  <text class="meta-title" x="1537" y="237">Assurance &amp; Evidence</text>
  <text class="meta-desc" x="1537" y="273">Fidelity · uncertainty · validation</text><text class="meta-desc" x="1537" y="299">safety · consistency · performance</text>
</g>

<text class="layer" x="70" y="610">LEVEL 2 · CONFIGURATION DIMENSIONS</text>
<text class="sub" x="1930" y="610" text-anchor="end">CANDIDATE CHOICES — COMBINATIONS REQUIRE EVIDENCE AND COMPATIBILITY CHECKS</text>

<!-- six configuration dimensions -->
<g>
  <rect class="box" x="40" y="650" width="310" height="475" rx="8"/><rect class="accent1" x="40" y="650" width="310" height="9" rx="4"/>
  <text class="dim-title" x="66" y="700">1 · System Composition</text><line class="rule" x1="66" y1="722" x2="324" y2="722"/>
  <text class="option" x="66" y="764">Single Twin</text><text class="option" x="66" y="808">Aggregate</text><text class="option" x="66" y="852">Composite</text><text class="option" x="66" y="896">Network</text><text class="option" x="66" y="940">Federated</text><text class="option" x="66" y="984">Ecosystem</text>
  <rect class="box" x="365" y="650" width="310" height="475" rx="8"/><rect class="accent2" x="365" y="650" width="310" height="9" rx="4"/>
